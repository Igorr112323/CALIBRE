name: Build and self-test Kolibri Windows demo EXE

on:
  push:
    branches:
      - arena/95c59e81-calibre
    paths:
      - '.github/workflows/build-windows-expert.yml'
      - '.github/workflows/build-android.yml'
      - 'calibre/**'
      - 'server.py'
      - 'desktop_launcher.py'
      - 'web/**'
      - 'mobile/**'
      - 'migrations/**'
      - 'requirements-desktop.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { throw "Установка Python-зависимостей завершилась с кодом $LASTEXITCODE" }
          python -m compileall -q calibre server.py desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Проверка Python-исходников не пройдена" }

      - name: Bundle license notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-notices | Out-Null
          Copy-Item THIRD_PARTY_NOTICES.md build-notices/THIRD_PARTY_NOTICES.md
          Copy-Item licenses/PyInstaller-COPYING.txt build-notices/PyInstaller-COPYING.txt
          $pdfiumLicenses = python -c "import importlib.metadata as m; print(m.distribution('pypdfium2')._path / 'licenses')"
          if (-not (Test-Path $pdfiumLicenses)) { throw "Не найдены bundled notices PDFium" }
          New-Item -ItemType Directory -Force -Path build-notices/pypdfium2 | Out-Null
          Copy-Item "$pdfiumLicenses/*" build-notices/pypdfium2/ -Recurse

      - name: Build and self-test the Windows package
        shell: pwsh
        run: |
          $common = @(
            "--clean", "--noconfirm", "--onefile",
            "--add-data", "alembic.ini;." ,
            "--add-data", "migrations;migrations",
            "--add-data", "web;web",
            "--add-data", "build-notices;licenses",
            "--collect-all", "alembic",
            "--collect-all", "uvicorn",
            "--collect-all", "sqlalchemy",
            "--collect-all", "pypdf",
            "--collect-all", "pdfplumber",
            "--collect-all", "pypdfium2",
            "--collect-all", "pdfminer",
            "--collect-all", "snowballstemmer",
            "--collect-all", "rapidfuzz",
            "--collect-all", "PIL",
            "--collect-all", "httpx",
            "--hidden-import", "sqlalchemy.dialects.sqlite",
            "--hidden-import", "calibre.part_graph",
            "--hidden-import", "calibre.part_hypotheses",
            "--hidden-import", "calibre.diagnostics"
          )
          python -m PyInstaller @common --console --name Kolibri-PC-selftest desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Не собран диагностический EXE" }
          if (-not (Test-Path "dist/Kolibri-PC-selftest.exe")) { throw "Диагностический EXE не найден" }
          $output = & "dist/Kolibri-PC-selftest.exe" --self-test 2>&1 | Out-String
          $testCode = $LASTEXITCODE
          if ($testCode -ne 0) {
            $details = $output.Replace("`r", " ").Replace("`n", " | ")
            Write-Output "::error title=Windows EXE self-test failed (exit $testCode)::$details"
            throw "Самопроверка Windows EXE завершилась ошибкой: $testCode"
          }
          python -m PyInstaller @common --windowed --name Kolibri-PC-Expert desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Не собран Kolibri-PC-Expert.exe" }
          if (-not (Test-Path "dist/Kolibri-PC-Expert.exe")) { throw "Kolibri-PC-Expert.exe не найден" }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Kolibri-PC-Expert.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Kolibri-PC-Expert.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kolibri-Windows-expert
          path: |
            dist/Kolibri-PC-Expert.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

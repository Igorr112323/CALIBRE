name: Build Android APK

on:
  push:
    branches:
      - arena/95c59e81-calibre
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Install JavaScript dependencies and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm run cap:sync

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          bash ./gradlew --no-daemon assembleDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/CALIBRE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CALIBRE-debug-apk
          path: dist/CALIBRE-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stage3-apk-${GITHUB_RUN_NUMBER}"
          sha256sum dist/CALIBRE-debug.apk > dist/SHA256SUMS.txt
          gh release create "$tag" \
            dist/CALIBRE-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "КАЛИБР — тестовый APK этапа 3 (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Отладочная тестовая сборка для проверки пользователем. Не является публикационным релизом. Демо-карточки помечены ДЕМО; не использовать их для настройки техники."

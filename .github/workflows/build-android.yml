name: Build Windows EXE and Android APK — GRN-471 demo (stages 4–6)

on:
  push:
    branches:
      - arena/95c59e81-calibre
    paths:
      - '.github/workflows/build-android.yml'
      - '.github/workflows/build-windows-expert.yml'
      - 'calibre/**'
      - 'server.py'
      - 'desktop_launcher.py'
      - 'web/**'
      - 'mobile/**'
      - 'migrations/**'
      - 'requirements-desktop.txt'
      - 'requirements.txt'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - name: Install JavaScript dependencies and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm run cap:sync

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          bash ./gradlew --no-daemon assembleDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/Kolibri-GRN-471-demo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kolibri-stage4-6-android
          path: dist/Kolibri-GRN-471-demo.apk
          if-no-files-found: error
          retention-days: 30

  build-windows-exe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { throw "Установка Python-зависимостей завершилась с кодом $LASTEXITCODE" }
          python -m compileall -q calibre server.py desktop_launcher.py migrations/versions
          if ($LASTEXITCODE -ne 0) { throw "Проверка Python-исходников не пройдена" }

      - name: Bundle third-party license notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-notices | Out-Null
          Copy-Item THIRD_PARTY_NOTICES.md build-notices/THIRD_PARTY_NOTICES.md
          Copy-Item licenses/PyInstaller-COPYING.txt build-notices/PyInstaller-COPYING.txt
          $pdfiumLicenses = python -c "import importlib.metadata as m; print(m.distribution('pypdfium2')._path / 'licenses')"
          if (-not (Test-Path $pdfiumLicenses)) { throw "Не найдены bundled notices PDFium" }
          New-Item -ItemType Directory -Force -Path build-notices/pypdfium2 | Out-Null
          Copy-Item "$pdfiumLicenses/*" build-notices/pypdfium2/ -Recurse

      - name: Build and smoke-test the console diagnostic executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name Kolibri-GRN-471-demo-selftest `
            --add-data "alembic.ini;." `
            --add-data "migrations;migrations" `
            --add-data "web;web" `
            --add-data "build-notices;licenses" `
            --collect-all alembic `
            --collect-all uvicorn `
            --collect-all sqlalchemy `
            --collect-all pypdf `
            --collect-all pdfplumber `
            --collect-all pypdfium2 `
            --collect-all pdfminer `
            --collect-all snowballstemmer `
            --collect-all rapidfuzz `
            --collect-all PIL `
            --collect-all httpx `
            --hidden-import sqlalchemy.dialects.sqlite `
            desktop_launcher.py
          if (-not (Test-Path "dist/Kolibri-GRN-471-demo-selftest.exe")) { throw "Не создан диагностический EXE" }
          $output = & "dist/Kolibri-GRN-471-demo-selftest.exe" --self-test 2>&1 | Out-String
          $testCode = $LASTEXITCODE
          if ($testCode -ne 0) {
            $details = $output.Replace("`r", " ").Replace("`n", " | ")
            Write-Output "::error title=Windows EXE self-test failed (exit $testCode)::$details"
            throw "Самопроверка диагностического EXE завершилась ошибкой: $testCode"
          }

      - name: Build the one-file Windows launcher
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name Kolibri-GRN-471-demo `
            --add-data "alembic.ini;." `
            --add-data "migrations;migrations" `
            --add-data "web;web" `
            --add-data "build-notices;licenses" `
            --collect-all alembic `
            --collect-all uvicorn `
            --collect-all sqlalchemy `
            --collect-all pypdf `
            --collect-all pdfplumber `
            --collect-all pypdfium2 `
            --collect-all pdfminer `
            --collect-all snowballstemmer `
            --collect-all rapidfuzz `
            --collect-all PIL `
            --collect-all httpx `
            --hidden-import sqlalchemy.dialects.sqlite `
            desktop_launcher.py
          if (-not (Test-Path "dist/Kolibri-GRN-471-demo.exe")) { throw "Не создан dist/Kolibri-GRN-471-demo.exe" }

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kolibri-stage4-6-windows
          path: dist/Kolibri-GRN-471-demo.exe
          if-no-files-found: error
          retention-days: 30

  publish-test-downloads:
    needs: [build-debug-apk, build-windows-exe]
    runs-on: ubuntu-24.04
    steps:
      - name: Download both build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Kolibri-stage4-6-*
          merge-multiple: true
          path: release-assets

      - name: Publish direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stage4-6-grn471-demo-${GITHUB_RUN_NUMBER}"
          sha256sum release-assets/Kolibri-GRN-471-demo.apk release-assets/Kolibri-GRN-471-demo.exe > release-assets/SHA256SUMS.txt
          gh release create "$tag" \
            release-assets/Kolibri-GRN-471-demo.apk \
            release-assets/Kolibri-GRN-471-demo.exe \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Kolibri — ГРН-471 демо, этапы 4–6 (${GITHUB_RUN_NUMBER})" \
            --notes "Демо-срез ГРН-471 Kolibri v4 для проверки этапов 4–6: Windows EXE с локальной админкой, проверкой PDF и Ollama-интеграцией; Android APK с подготовленным офлайн-каталогом. В релиз не включены исходный PDF и извлечённые из него изображения. Ollama и модели устанавливаются отдельно; без них доступны подготовленные данные, поиск и просмотр. Сборки предназначены для теста владельцем, не являются сертифицированной инструкцией или обученной моделью."

name: Build Android APK

on:
  push:
    branches:
      - 'arena/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - name: Install dependencies and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm run cap:sync
          node build-stand.mjs
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          bash ./gradlew --no-daemon assembleDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/Kolibri-Mehfak.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kolibri-Mehfak
          path: dist/Kolibri-Mehfak.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kolibri-mehfak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/Kolibri-Mehfak.apk dist/Kolibri-stend.html \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Kolibri Мехфак — debug APK (${GITHUB_RUN_NUMBER})" \
            --notes "Отладочная офлайн-сборка Android. Перед эксплуатацией техники сверьте данные с руководством производителя."

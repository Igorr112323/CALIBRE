name: Build Android APK

on:
  push:
    branches:
      - 'arena/**'
      - main
  workflow_dispatch:
    inputs:
      publish_base:
        description: Store APK shell in current branch
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - name: Install dependencies and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm run cap:sync
          node build-stand.mjs
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          bash ./gradlew --no-daemon assembleDebug
          python3 -c "import glob,xml.etree.ElementTree as e; p=glob.glob('app/build/intermediates/merged_manifests/debug/**/AndroidManifest.xml',recursive=True); assert p, 'Merged manifest not found'; banned={'android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE','android.permission.CHANGE_NETWORK_STATE'}; ns='{http://schemas.android.com/apk/res/android}name'; permissions={x.get(ns) for x in e.parse(p[0]).getroot().findall('uses-permission')}; assert not permissions.intersection(banned), 'Network permissions found in APK'"
          python3 -c "import zipfile; z=zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk'); assert not any('/studio/' in p.lower() or p.endswith('/studio.js') or p.endswith('/server.mjs') for p in z.namelist()), 'Studio files found in APK'"
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/Kolibri-Mehfak.apk
      - name: Store APK shell in current branch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_base == 'true'
        run: |
          mkdir -p base
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk base/Kolibri-Mehfak.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base/Kolibri-Mehfak.apk
          git diff --cached --quiet || git commit -m "Add Android APK shell for local studio"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kolibri-Mehfak
          path: dist/Kolibri-Mehfak.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK release
        if: github.event.inputs.publish_base != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kolibri-mehfak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/Kolibri-Mehfak.apk dist/Kolibri-stend.html \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Kolibri Мехфак — debug APK (${GITHUB_RUN_NUMBER})" \
            --notes "Отладочная офлайн-сборка Android. Перед эксплуатацией техники сверьте данные с руководством производителя."

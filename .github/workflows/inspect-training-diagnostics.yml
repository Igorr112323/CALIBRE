name: Inspect prior training diagnostics

on:
  push:
    branches:
      - arena/0d487d0e-calibre
    paths:
      - '.github/workflows/inspect-training-diagnostics.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current commit
        uses: actions/checkout@v5
      - name: Download and expose requested diagnostic data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh run download 43511938080 --repo "$GITHUB_REPOSITORY" --name kolibri-qwen-training-diagnostics --dir "$RUNNER_TEMP/prior-diagnostics"
          python - <<'PY'
          import base64
          import json
          import os
          import zlib
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'prior-diagnostics'
          names = ['training-metrics.json', 'gguf-metrics.json', 'AI_EVALUATION_QWEN25_3B_FINETUNED.json', 'release-gate.json', 'dataset-manifest.json']
          payload = {}
          for name in names:
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: expected one file, found {len(matches)}')
              payload[name] = json.loads(matches[0].read_text(encoding='utf-8'))
          logs = list(root.rglob('training-log.jsonl'))
          if len(logs) != 1:
              raise RuntimeError('Training log is missing or ambiguous')
          records = [json.loads(line) for line in logs[0].read_text(encoding='utf-8').splitlines() if line.strip()]
          payload['training_log_summary'] = {'records': len(records), 'first_three': records[:3], 'last_three': records[-3:]}
          encoded = base64.b64encode(zlib.compress(json.dumps(payload, ensure_ascii=False).encode('utf-8'), 9)).decode('ascii')
          chunks = [encoded[index:index + 3000] for index in range(0, len(encoded), 3000)]
          for index, chunk in enumerate(chunks, 1):
              print(f'::notice file=.github/workflows/inspect-training-diagnostics.yml,line=1,title=Diagnostic fragment {index} of {len(chunks)}::KOLIBRI_{index:03}_{len(chunks):03}_{chunk}')
          PY

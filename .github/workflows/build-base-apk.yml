name: Store Android APK base template

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build-base-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - name: Build APK shell
        working-directory: mobile
        run: |
          npm ci
          npm run cap:sync
          cd android
          bash ./gradlew --no-daemon assembleDebug
          mkdir -p ../../base
          cp app/build/outputs/apk/debug/app-debug.apk ../../base/Kolibri-Mehfak.apk
      - name: Store APK shell in current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base/Kolibri-Mehfak.apk
          git diff --cached --quiet || git commit -m "Add Android APK shell for local studio"
          git push origin HEAD:${GITHUB_REF_NAME}

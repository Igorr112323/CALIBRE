<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="description" content="Справочник сельскохозяйственной техники КАЛИБР">
  <link rel="stylesheet" href="/app.css">
  <title>КАЛИБР — справочник сельхозтехники</title>
</head>
<body class="app-page">
  <div class="phone" id="app">
    <header class="app-header">
      <button class="back" id="back" data-action="back" aria-label="Назад">‹</button>
      <h1 id="title"><span class="logo">КАЛИБР</span><small>Сельхозтехника</small></h1>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="active" data-action="home">⌂<span>Главная</span></button>
      <button data-action="catalog">▦<span>Машины</span></button>
    </nav>
    <div class="modal" id="modal" aria-hidden="true">
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>

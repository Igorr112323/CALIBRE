<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="description" content="Справочник сельскохозяйственной техники Kolibri">
  <link rel="stylesheet" href="/app.css">
  <title>Kolibri — справочник сельхозтехники</title>
</head>
<body class="app-page">
  <div class="phone" id="app">
    <header class="app-header">
      <button class="back" id="back" data-action="back" aria-label="Назад">‹</button>
      <img class="brand-mark" src="./kolibri-mark.png" alt="">
      <h1 id="title"><span class="logo">Kolibri</span><small>Справочник сельхозтехники</small></h1>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="active" data-action="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-7v6h-4A1.5 1.5 0 0 1 3 19.5z"/></svg></span><span>Главная</span></button>
      <button data-action="catalog"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14V9h7l2 3h5a2 2 0 0 1 2 2v2h-2.2a3 3 0 0 0-5.6 0H9.8a3 3 0 0 0-5.6 0H3v-2zM7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm8 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 9V5h5l1 4"/></svg></span><span>Машины</span></button>
    </nav>
    <div class="modal" id="modal" aria-hidden="true">
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>

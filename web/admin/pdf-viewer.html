<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#176b43"><title>Kolibri — источник PDF</title>
  <link rel="stylesheet" href="/admin/static/admin/admin.css">
  <style>
    body{background:#edf1ee}.viewer{max-width:1180px;margin:20px auto;padding:0 16px}.toolbar,.quote-box{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #dfe9e0;border-radius:12px;padding:11px;margin-bottom:10px}.toolbar input{min-width:80px;flex:1;padding:9px;border:1px solid #dfe9e0;border-radius:8px;font-family:inherit;font-size:12px}.toolbar button{padding:9px 12px;border:0;border-radius:8px;background:#176b43;color:#fff;font-weight:700;cursor:pointer}.toolbar button.secondary{background:#e7f1e8;color:#176b43}.status{color:#718077;font-size:12px;padding:3px 2px;min-height:22px}.pdf-frame{width:100%;height:calc(100vh - 205px);min-height:520px;border:1px solid #dfe5df;border-radius:10px;background:#dfe5e0}.quote-box{display:block;color:#536259;font-size:12px;line-height:1.6}.quote-box strong{display:block;color:#176b43;font-size:9px;letter-spacing:.1em;margin-bottom:4px}.topbar{height:64px;background:#fff;border-bottom:1px solid #dfe9e0;display:flex;align-items:center;padding:0 20px;gap:10px}.topbar .brand-symbol{width:36px;height:36px;border-radius:11px;background:#176b43;color:white;display:grid;place-items:center;font-weight:800}.topbar strong,.topbar small{display:block}.topbar strong{color:#105333;font-size:15px}.topbar small{color:#718077;font-size:10px;margin-top:3px}.topbar a{margin-left:auto;color:#176b43;font-size:11px}@media(max-width:600px){.viewer{padding:0 8px}.pdf-frame{height:calc(100vh - 240px);min-height:440px}}
  </style>
</head>
<body>
<header class="topbar"><span class="brand-symbol">K</span><div><strong>Kolibri</strong><small>Страница документа-источника</small></div><a href="/admin">В панель</a></header>
<main class="viewer">
  <div class="toolbar"><input id="file-url" aria-label="Адрес локального PDF" placeholder="Адрес PDF из локальной базы"><input id="page-number" type="number" value="1" min="1" aria-label="Номер страницы"><button id="open">Открыть страницу</button><a id="download" hidden>Скачать PDF</a></div>
  <div class="quote-box" id="quote-box" hidden><strong>ЦИТАТА ИЗ ОТВЕТА</strong><span id="quote-text"></span></div>
  <div class="status" id="status" role="status">Откройте документ, загруженный в локальную базу Kolibri.</div>
  <iframe class="pdf-frame" id="pdf-frame" title="Документ PDF" hidden></iframe>
</main>
<script src="/admin/static/admin/pdf-viewer.js" defer></script>
</body></html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#176b43"><title>КАЛИБР — страница методички</title>
  <link rel="stylesheet" href="/admin/static/shared.css">
  <style>
    body{background:#edf1ee}.viewer{max-width:1100px;margin:18px auto;padding:0 14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #dfe9e0;border-radius:14px;padding:10px;margin-bottom:10px}.toolbar input{min-width:100px;flex:1;padding:9px;border:1px solid #dfe9e0;border-radius:8px}.toolbar button{padding:9px 12px;border:0;border-radius:8px;background:#176b43;color:white;font-weight:700}.toolbar .secondary{background:#e7f1e8;color:#176b43}.status{color:#718077;font-size:13px;padding:4px 2px;min-height:24px}.page-wrap{overflow:auto;text-align:center;background:#dfe5e0;border-radius:12px;padding:16px;min-height:65vh}.pdf-page{position:relative;display:inline-block;background:#fff;box-shadow:0 3px 16px #0002;line-height:0}.pdf-page canvas{display:block}.text-layer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;text-align:initial;transform-origin:0 0;z-index:1}.text-layer span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}.text-layer span.cite-highlight{background:rgba(255,213,0,.58);outline:1px solid rgba(205,158,0,.4)}.page-count{font-variant-numeric:tabular-nums;color:#536259;font-size:13px;white-space:nowrap}@media(max-width:600px){.viewer{padding:0 8px}.page-wrap{padding:6px}}
  </style>
</head>
<body>
<header class="topbar"><div class="brand-mark">К</div><div><strong>КАЛИБР</strong><small>Страница источника</small></div><a href="/admin" style="margin-left:auto;color:#176b43">В админку</a></header>
<main class="viewer">
  <div class="toolbar">
    <input id="file-url" aria-label="Адрес PDF" placeholder="PDF-файл из локальной базы">
    <input id="quote" aria-label="Цитата для подсветки" placeholder="Цитата для подсветки">
    <button id="open">Открыть страницу</button>
  </div>
  <div class="toolbar">
    <button id="previous" class="secondary" title="Предыдущая страница">←</button>
    <span class="page-count"><input id="page-number" type="number" value="1" min="1" style="width:64px"> / <span id="page-total">—</span></span>
    <button id="next" class="secondary" title="Следующая страница">→</button>
    <button id="zoom-out" class="secondary">−</button><button id="zoom-in" class="secondary">+</button>
    <span class="page-count" id="zoom-label">100%</span>
  </div>
  <div class="status" id="status" role="status">Просмотрщик PDF.js работает локально. Откройте страницу источника из карточки или укажите локальный PDF.</div>
  <div class="page-wrap"><div class="pdf-page" id="pdf-page" hidden><canvas id="canvas"></canvas><div class="text-layer" id="text-layer"></div></div></div>
</main>
<script type="module" src="/admin/static/admin/pdf-viewer.js"></script>
</body></html>
